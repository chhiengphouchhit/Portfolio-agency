<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="300" height="300" rx="60" fill="#0b0f19" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Glowing Monogram 'K' or 'V' / Tech geometry -->
  <g filter="url(#logoGlow)" transform="translate(50, 50)">
    <path d="M 40 30 L 40 170" stroke="url(#logoGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 45 105 L 140 30" stroke="url(#logoGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M 90 95 L 150 170" stroke="url(#logoGrad)" stroke-width="26" stroke-linecap="round" />
    <circle cx="150" cy="170" r="10" fill="#06b6d4" />
    <circle cx="140" cy="30" r="10" fill="#22c55e" />
  </g>
</svg>
