<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd1a9" />
      <stop offset="100%" stop-color="#f8a576" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="190" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.6" fill="none" />

  <!-- Abstract Tech Grid Glow -->
  <circle cx="200" cy="180" r="120" fill="url(#primaryGrad)" opacity="0.15" filter="url(#shadow)" />

  <!-- Avatar Character Head & Body -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Hoodie -->
    <path d="M 100 370 C 110 270, 290 270, 300 370 Z" fill="#334155" filter="url(#shadow)"/>
    <!-- Hoodie Inner -->
    <path d="M 140 370 C 150 285, 250 285, 260 370 Z" fill="#1e293b" />
    <path d="M 180 300 L 200 340 L 220 300 Z" fill="url(#primaryGrad)" opacity="0.8"/>

    <!-- Neck -->
    <rect x="175" y="220" width="50" height="60" rx="10" fill="url(#skinGrad)" />

    <!-- Head -->
    <rect x="145" y="110" width="110" height="135" rx="55" fill="url(#skinGrad)" filter="url(#shadow)"/>

    <!-- Modern Glasses / Cyber Visor -->
    <rect x="135" y="150" width="130" height="42" rx="12" fill="#0f172a" />
    <rect x="140" y="154" width="54" height="34" rx="8" fill="url(#primaryGrad)" opacity="0.9"/>
    <rect x="206" y="154" width="54" height="34" rx="8" fill="url(#primaryGrad)" opacity="0.9"/>
    <rect x="194" y="167" width="12" height="6" fill="#0f172a" />
    <!-- Visor Reflection -->
    <path d="M 145 158 L 165 158 L 150 182 L 142 182 Z" fill="#ffffff" opacity="0.6" />
    <path d="M 211 158 L 231 158 L 216 182 L 208 182 Z" fill="#ffffff" opacity="0.6" />

    <!-- Modern Hair Cut -->
    <path d="M 135 130 C 135 70, 265 70, 265 130 C 265 95, 240 85, 200 85 C 160 85, 140 100, 135 130 Z" fill="#0f172a" />
    <path d="M 130 135 Q 140 100 180 95 Q 160 115 150 140 Z" fill="#1e293b" />
    <!-- Smile -->
    <path d="M 185 210 Q 200 220 215 210" stroke="#b45309" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>

  <!-- Coding / Creator Tech Badge -->
  <g transform="translate(270, 270)">
    <circle cx="40" cy="40" r="36" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#shadow)"/>
    <text x="40" y="47" font-family="'Fira Code', monospace" font-size="22" font-weight="bold" fill="#22c55e" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
